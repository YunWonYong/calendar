<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Calendar Test OAuth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --background-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --focus-ring: rgba(79, 70, 229, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #f0f4ff 0%, #eef2ff 50%, #f8fafc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        section {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01), 0 0 1px 1px rgba(0, 0, 0, 0.02);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        section:hover {
            box-shadow: 0 25px 30px -5px rgba(79, 70, 229, 0.08), 0 10px 12px -6px rgba(0, 0, 0, 0.03);
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        header p {
            margin-top: 0.5rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form--input-box {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        form label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            transition: color 0.2s;
        }

        form input {
            width: 100%;
            height: 3.25rem;
            padding: 0 1.25rem;
            font-size: 1rem;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        form input:focus {
            background-color: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        form input:focus + label,
        .form--input-box:focus-within label {
            color: var(--primary-color);
        }

        button {
            width: 100%;
            height: 3.25rem;
            margin-top: 0.5rem;
            background-color: var(--primary-color);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2);
        }

        @media (max-width: 480px) {
            section {
                padding: 2rem 1.5rem;
                border-radius: 16px;
            }

            header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <section>
            <header>
                <h1>테스트 로그인</h1>
                <p>OAuth 테스트를 위한 계정 정보를 입력하세요</p>
            </header>
            <form action="/test/oauth/login" method="post">
                <div class="form--input-box">
                    <label for="identity">아이디</label>
                    <input id="identity" name="identity" placeholder="아이디를 입력하세요" required autocomplete="username" minlength="3" />
                </div>
                <button type="submit">
                    로그인
                </button>
                <input type="hidden" name="code" value="{{code}}">
            </form>
        </section>
    </main>
</body>
</html>
